# oauth2-proxy config for the Dyad hosted deployment.
# Fill in client_id/client_secret from a Google Cloud OAuth client (free):
#   - APIs & Services → Credentials → OAuth client ID → Web application
#   - Authorized redirect URI: https://<HOST>/oauth2/callback
#   - (Google may require a consent screen setup first; use Internal user type
#     if this is a Workspace domain, else External + test users.)
# cookie_secret is injected from deploy/oauth2-cookie-secret.inc by
# deploy/oauth2-proxy.service (sed) or via --cookie-secret env.

provider = "google"
client_id = "REPLACE_WITH_GOOGLE_CLIENT_ID"
client_secret = "REPLACE_WITH_GOOGLE_CLIENT_SECRET"

# Only @nextbillion.ai accounts may sign in.
email_domains = ["nextbillion.ai"]

redirect_url = "https://HOST/oauth2/callback"
upstreams = ["static:204"]

# Session cookie: HttpOnly, Secure (TLS terminated at Caddy).
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_name = "_dyad_oauth2"
# cookie_secret comes from setup-secrets.sh

# Forward-auth mode: Caddy hits /oauth2/auth; no page rendering needed here.
whitelist_domains = ["HOST"]
skip_auth_preflight = false

pass_authorization_header = false
set_authorization_header = false
set_xauthrequest = false